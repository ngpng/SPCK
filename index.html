<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="script/index.js" defer></script>
</head>
<body>
    <header>
        <h1>GameVault</h1>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Games</a></li> 
            <button class="search-btn" onclick="window.location.href='find_page.html'">Search For Games</button>
            <li><a href="login_page.html">Logout</a></li>
        </ul>
    </header> 

    <section class="featured-games">
        <h2>Featured Game</h2>
        <div id="featured-game-container"></div>
    </section>

    <section class="list-games">
        <h2>List Of Games</h2>
        <div id="game-list-container" class="movie-grid"></div>
    </section>

    <button onclick="openChatBot()" class="chatBot-btn">
        <img src="chatboticon.png" alt="Chatbot Icon" style="width: 20px; height: 20px; margin-left: 5px;">
    </button>

    <iframe
        id="chatbot"
        src="https://www.chatbase.co/chatbot-iframe/WsnlWigaIqV5awhD5SJn2"
        width="100%"
        style="height: 25%; min-height: 500px; display: none; max-width: 20%; position: fixed; bottom: 60px; right: 20px;"
        frameborder="0"
        allow="microphone"
    ></iframe>

    <script>
        let flagChatBot = false;
        function openChatBot() {
            let chatbot = document.getElementById("chatbot");

            if (flagChatBot === false) {
                chatbot.style.display = "block";
                flagChatBot = true;
            } else {
                chatbot.style.display = "none";
                flagChatBot = false;
            }
        }
    </script>
</body>
</html>
